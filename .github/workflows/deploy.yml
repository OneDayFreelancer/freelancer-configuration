name: Deploy to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Configurar SSH
        run: |
          install -m 700 -d ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "${{ secrets.VPS_PORT || 22 }}" -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts

      - name: Git pull + compose up en /opt
        run: |
          ssh -p "${{ secrets.VPS_PORT || 22 }}" "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" bash -s <<'REMOTE'
          set -euo pipefail
          cd /opt/freelancer-configuration/
          git fetch origin main
          git reset --hard origin/main

          # Orden: NPM primero (crea la red proxy), luego el resto
          for dir in infraestructure/* projects/*; do
            if [ -f "$dir/docker-compose.yaml" ]; then
              echo ">>> $dir"
              (cd "$dir")
            fi
          done
          REMOTE
