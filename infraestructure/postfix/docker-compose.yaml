services:
  postfix:
    image: boky/postfix:latest
    container_name: smtp-relay
    restart: unless-stopped
    hostname: mail.${DOMAIN}
    ports:
      # Solo localhost del VPS. Cambia a "587:587" si apps externas deben conectarse
      # (en ese caso añade autenticación, ver README del proyecto boky/postfix).
      - "127.0.0.1:587:587"
    environment:
      ALLOWED_SENDER_DOMAINS: "${DOMAIN§}"
      POSTFIX_myhostname: "mail.${DOMAIN}"
      SMTPD_SASL_USERS: "${SMTP_USER}:${SMTP_PASS}"
      DKIM_BACKEND: "opendkim"
      DKIM_AUTOGENERATE: "1"
      DKIM_SELECTOR: "mail"
      POSTFIX_inet_protocols: "ipv4"
    networks:
      - proxy
    volumes:
      - ./dkim-keys:/etc/opendkim/keys
      - postfix-spool:/var/spool/postfix
volumes:
  postfix-spool:

networks:
  proxy:
    external: true