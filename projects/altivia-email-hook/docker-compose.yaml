services:
  altivia-email-hook:
    image: ghcr.io/onedayfreelancer/altivia-email-hook:latest
    container_name: altivia-email-hook
    restart: unless-stopped
    pull_policy: always
    environment:
      - PORT=80
      - SEND_EMAIL_HOOK_SECRET
      - SUPABASE_URL
      - SMTP_HOST
      - SMTP_PORT
      - SMTP_USER
      - SMTP_PASS
      - SEND_EMAIL_HOOK_SECRET
      - MAIL_FROM
      - SMTP_TLS_REJECT_UNAUTHORIZED
    networks:
      - proxy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  proxy:
    external: true
